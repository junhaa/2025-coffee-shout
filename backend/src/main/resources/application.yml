spring:
  application:
    name:
      coffee-shout


logging:
  level:
    org.springframework.boot.autoconfigure: DEBUG
    io.micrometer.cloudwatch2: DEBUG
    software.amazon.awssdk: DEBUG
    software.amazon.awssdk.auth: DEBUG
    software.amazon.awssdk.core.exception: DEBUG
    root: INFO

debug: true


management:
  endpoints:
    web:
      exposure:
        include: "*"  # 모든 actuator 엔드포인트 노출 (테스트용)
  metrics:
    export:
      cloudwatch:
        enabled: true
        namespace: coffee-shout-dev-test
        step: 30s  # 더 짧은 간격으로 테스트
        batch-size: 20
        region: ap-northeast-2

